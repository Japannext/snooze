{{- if .Values.keycloak.enabled }}
{{- $clientName := required ".keycloak.clientName is required" .Values.keycloak.clientName }}
{{- $realm := required ".keycloak.realm is required" .Values.keycloak.realm }}
---
apiVersion: keycloak.japannext.co.jp/v1alpha2
kind: KeycloakClient
metadata:
  name: "{{ $clientName }}"
  namespace: "{{ .Release.Namespace }}"
spec:
  endpoint:
    kind: "{{ .Values.keycloak.endpointKind }}"
    name: "{{ .Values.keycloak.endpointName }}"
  realm: "{{ $realm }}"
  secret:
    enabled: true
    name: "{{ .Release.Name }}-oidc-secret"
  config:
    name: "{{ $clientName }}"
    enabled: true
    baseUrl: "https://{{ .Values.ingress.host }}"
    redirectUris:
    - https://{{ .Values.ingress.host }}/api/auth/oidc/callback
    - https://{{ .Values.ingress.host }}/
    - "*"
    description: "Snooze: An alerting management system"
    publicClient: false
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-apiserver-config"
  namespace: "{{ .Release.Namespace }}"
data:
  auth.yaml: |
    # Configuration of auth backend
    ---
    {{- if .Values.keycloak.enabled }}
    oidc:
      url: "{{ .Values.keycloak.url }}"
      client_id: "{{ .Values.keycloak.clientName }}"
      callback_url: "https://{{ $.Values.ingress.host }}/#/callback/oidc"
      scopes: [openid, profile, email, roles]
      cacert: /cacert/ca.crt
      display_name: "Keycloak"
      roles_field: "{{ .Values.keycloak.clientName }}-roles"
      color: "#00a2cf"
      icon: "Openid"
    {{- end }}
  {{- if .Values.apiserver.cors }}
  cors.yaml: |
    # CORS configuration
    ---
    {{- .Values.apiserver.cors | toYaml | nindent 4 }}
  {{- end }}

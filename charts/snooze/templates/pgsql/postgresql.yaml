# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/acid.zalan.do/postgresql_v1.json
{{- if .Values.pgsql.enabled }}
---
apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: "{{ .Release.Name }}-pgsql"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: database
spec:
  numberOfInstances: {{ .Values.pgsql.replicaCount }}
  teamId: "{{ .Release.Name }}"
  spiloRunAsUser: 101
  spiloRunAsGroup: 103
  spiloFSGroup: 103
  volume:
    size: {{ .Values.pgsql.volumeSize }}
    storageClass: {{ .Values.pgsql.storageClass }}
  sidecars:
  - name: prometheus-exporter
    image: quay.io/prometheuscommunity/postgres-exporter
    env:
    - name: DATA_SOURCE_URI
      value: 127.0.0.1:5432
    - name: DATA_SOURCE_USER
      value: postgres
    - name: DATA_SOURCE_PASS
      valueFrom:
        secretKeyRef:
          name: "postgres.{{ .Release.Name }}-pgsql.credentials.postgresql.acid.zalan.do"
          key: password
          optional: true
    ports:
    - name: metrics
      containerPort: 9187
      protocol: TCP
    resources:
      limits:
        memory: 100Mi
      requests:
        cpu: 100m
        memory: 100Mi
  users:
    snooze: [superuser, createdb]
  databases:
    snooze: snooze
  postgresql:
    version: "{{ .Values.pgsql.version }}"
    parameters:
      max_connections: "{{ .Values.pgsql.maxConnections }}"
      log_destination: stderr
      logging_collector: 'false'
      log_line_prefix: '%m %u@%d:%a '
{{- end }}
